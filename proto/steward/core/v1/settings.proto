syntax = "proto3";

package steward.core.v1;

option go_package = "github.com/Steward-GRC/steward-core/gen/go/steward/core/v1;corev1";

// Announcement is a site-wide banner shown at the top of every app while
// enabled. level is "info" or "warning".
message Announcement {
  bool enabled = 1;
  string level = 2;
  string message = 3;
}

// Maintenance is a site-wide maintenance notice shown while enabled.
message Maintenance {
  bool enabled = 1;
  string message = 2;
}

// Holiday is one day off on the work calendar. date is a strict YYYY-MM-DD
// civil date in the calendar's time zone; label is 0 to 80 characters (empty is allowed).
message Holiday {
  string date = 1;
  string label = 2;
}

// WorkCalendar is the one site-wide calendar that says which days count as
// working days. weekdays are ISO numbers (1 Monday to 7 Sunday), at least one,
// no repeats. timezone is an IANA name ("UTC", "Europe/London"); the empty
// string and "Local" are refused. holidays are unique dates, at most 366.
// Whole days only. Unset, the calendar is Monday to Friday, UTC, no holidays.
message WorkCalendar {
  repeated int32 weekdays = 1;
  string timezone = 2;
  repeated Holiday holidays = 3;
}

// GlobalSettings is the stored settings singleton. The banners are adopter
// settings with an empty default.
//
// work_calendar has message presence. On Get it is always set: the effective
// calendar, the defaults when none was ever saved. On Set an absent
// work_calendar means "leave the stored calendar unchanged" (so a client that
// predates the field cannot wipe it); a present one replaces it whole and is
// validated, an invalid one is InvalidArgument and nothing is written.
message GlobalSettings {
  Announcement announcement = 1;
  Maintenance maintenance = 2;
  WorkCalendar work_calendar = 3;
}

message GetGlobalSettingsRequest {}

message GetGlobalSettingsResponse {
  GlobalSettings settings = 1;
}

message SetGlobalSettingsRequest {
  GlobalSettings settings = 1;
  string actor_user_id = 2;
}

message SetGlobalSettingsResponse {
  GlobalSettings settings = 1;
}

// EmailServiceStatus is the keyless view of the outbound email-service
// configuration. It has no field for the key, so the key can't leave through
// SettingsService.
message EmailServiceStatus {
  bool api_key_set = 1;
  string domain = 2;
  string region = 3;
  string from_address = 4;
  bool enabled = 5;
  string updated_by = 6;
  // The provider adapter the sender uses, picked by the adopter.
  string provider = 7;
}

// SetEmailServiceConfigRequest writes the configuration. api_key has three
// states: unset keeps the stored key, empty clears it, any other value
// replaces it. The key is encrypted at rest.
message SetEmailServiceConfigRequest {
  optional string api_key = 1;
  string domain = 2;
  string region = 3;
  string from_address = 4;
  bool enabled = 5;
  string actor_user_id = 6;
  string provider = 7;
}

message SetEmailServiceConfigResponse {
  EmailServiceStatus status = 1;
}

message EmailServiceConfigStatusRequest {}

message EmailServiceConfigStatusResponse {
  EmailServiceStatus status = 1;
}

// SettingsService reads and writes the global settings and the keyless
// email-service configuration. No RPC here returns the key: that is
// EmailServiceSecretService, which the gateway never serves.
service SettingsService {
  rpc GetGlobalSettings(GetGlobalSettingsRequest) returns (GetGlobalSettingsResponse);
  rpc SetGlobalSettings(SetGlobalSettingsRequest) returns (SetGlobalSettingsResponse);
  rpc SetEmailServiceConfig(SetEmailServiceConfigRequest) returns (SetEmailServiceConfigResponse);
  rpc EmailServiceConfigStatus(EmailServiceConfigStatusRequest) returns (EmailServiceConfigStatusResponse);
}
