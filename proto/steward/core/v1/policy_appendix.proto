syntax = "proto3";

package steward.core.v1;

import "google/protobuf/timestamp.proto";
import "steward/core/v1/policy.proto";

option go_package = "github.com/Steward-GRC/steward-core/gen/go/steward/core/v1;corev1";

// AppendixVersionState is the state of one row of an appendix's version table.
enum AppendixVersionState {
  APPENDIX_VERSION_STATE_UNSPECIFIED = 0;
  // What the author is writing. An appendix has at most one.
  APPENDIX_VERSION_STATE_DRAFT = 1;
  // A finished edition. Readers see the latest one.
  APPENDIX_VERSION_STATE_PUBLISHED = 2;
}

// AppendixVersion is one row of an appendix's version table.
message AppendixVersion {
  string id = 1;
  int32 version_no = 2;
  AppendixVersionState state = 3;
  string title = 4;
  // Serialized Lexical editor state.
  string content_json = 5;
  google.protobuf.Timestamp created_at = 6;
  string created_by = 7;
  google.protobuf.Timestamp updated_at = 8;
  string updated_by = 9;
  // Set on a published row only.
  google.protobuf.Timestamp published_at = 10;
  string published_by = 11;
  // Everyone who saved or published this row, each once, in the order they
  // first did.
  repeated string contributor_ids = 12;
}

// AppendixVersionInfo is a row of the version table without its text.
message AppendixVersionInfo {
  int32 version_no = 1;
  AppendixVersionState state = 2;
  repeated string contributor_ids = 3;
}

// PolicyAppendix is an appendix of a policy or procedure. It belongs to the
// document, never to one of its versions, and has a version table of its own.
// Core applies no reader filtering: published and draft are both returned and
// the gateway decides what a reader sees.
message PolicyAppendix {
  string id = 1;
  string policy_id = 2;
  // A, B, C by place among the live appendices; empty while retired.
  string letter = 3;
  // Zero-based among the live appendices.
  int32 order_index = 4;
  // Unset while the appendix is live.
  google.protobuf.Timestamp retired_at = 5;
  // The latest published row, unset until the first publish.
  AppendixVersion published = 6;
  // The open draft, unset when there is none.
  AppendixVersion draft = 7;
  // Every row of the version table, oldest first, the draft last.
  repeated AppendixVersionInfo versions = 8;
  // The published rows, newest first, without the draft.
  repeated AppendixVersion published_versions = 9;
  // Everyone who saved or published any row, each once, in the order they
  // first did.
  repeated string contributor_ids = 10;
}

// ListPolicyAppendicesRequest lists a policy's appendices: the live ones in
// order, then the retired ones when include_retired is set.
message ListPolicyAppendicesRequest {
  string policy_id = 1;
  bool include_retired = 2;
}

message ListPolicyAppendicesResponse {
  repeated PolicyAppendix appendices = 1;
}

// GetPolicyAppendixRequest looks one appendix up by id. A retired appendix is
// returned too, with an empty letter.
message GetPolicyAppendixRequest {
  string id = 1;
}

message GetPolicyAppendixResponse {
  PolicyAppendix appendix = 1;
}

// CreatePolicyAppendixRequest adds an appendix as a draft v1, last among the
// live ones. A blank title becomes "Appendix <letter>", moving on to the next
// letter while the policy's appendices (retired ones included) already use it.
message CreatePolicyAppendixRequest {
  string policy_id = 1;
  string title = 2;
  string content_json = 3;
  string actor_user_id = 4;
}

message CreatePolicyAppendixResponse {
  PolicyAppendix appendix = 1;
}

// SaveAppendixDraftRequest updates the open draft, or starts draft vN+1 beside
// the published row. A save equal to the published title and content, with no
// draft open, changes nothing.
message SaveAppendixDraftRequest {
  string id = 1;
  string title = 2;
  string content_json = 3;
  string actor_user_id = 4;
}

message SaveAppendixDraftResponse {
  PolicyAppendix appendix = 1;
}

// PublishAppendixRequest promotes the draft to the next published version.
message PublishAppendixRequest {
  string id = 1;
  string actor_user_id = 2;
}

message PublishAppendixResponse {
  PolicyAppendix appendix = 1;
}

// RetireAppendixRequest hides an appendix and keeps it with its history.
message RetireAppendixRequest {
  string id = 1;
  string actor_user_id = 2;
}

message RetireAppendixResponse {
  PolicyAppendix appendix = 1;
}

// RestoreAppendixRequest brings a retired appendix back, last in the order.
message RestoreAppendixRequest {
  string id = 1;
  string actor_user_id = 2;
}

message RestoreAppendixResponse {
  PolicyAppendix appendix = 1;
}

// ReorderPolicyAppendicesRequest sets the order of a policy's live appendices.
// ordered_ids must hold every live (not retired) appendix of the policy
// exactly once. Retired appendices keep no place and are not named.
message ReorderPolicyAppendicesRequest {
  string policy_id = 1;
  repeated string ordered_ids = 2;
  string actor_user_id = 3;
}

// ReorderPolicyAppendicesResponse is the policy's live appendices in the new
// order, with their letters. A reorder makes no draft and touches no version.
message ReorderPolicyAppendicesResponse {
  repeated PolicyAppendix appendices = 1;
}

// DiffPolicyAppendixRequest asks for the section diff of one appendix. The
// from side is the published row's content (empty when none is published). The
// to side is content_json when given (text the author has not saved), else the
// draft's content, else the published row's. Nothing is saved.
message DiffPolicyAppendixRequest {
  string id = 1;
  optional string content_json = 2;
}

// DiffPolicyAppendixResponse is the diff, one entry per section key found on
// either side, in key order. A side that did not change reads "unchanged".
message DiffPolicyAppendixResponse {
  repeated SectionDiff diffs = 1;
}

// PolicyAppendixService holds the appendices a policy or procedure owns.
service PolicyAppendixService {
  rpc ListPolicyAppendices(ListPolicyAppendicesRequest) returns (ListPolicyAppendicesResponse);
  rpc GetPolicyAppendix(GetPolicyAppendixRequest) returns (GetPolicyAppendixResponse);
  rpc CreatePolicyAppendix(CreatePolicyAppendixRequest) returns (CreatePolicyAppendixResponse);
  rpc SaveAppendixDraft(SaveAppendixDraftRequest) returns (SaveAppendixDraftResponse);
  rpc PublishAppendix(PublishAppendixRequest) returns (PublishAppendixResponse);
  rpc RetireAppendix(RetireAppendixRequest) returns (RetireAppendixResponse);
  rpc RestoreAppendix(RestoreAppendixRequest) returns (RestoreAppendixResponse);
  rpc ReorderPolicyAppendices(ReorderPolicyAppendicesRequest) returns (ReorderPolicyAppendicesResponse);
  rpc DiffPolicyAppendix(DiffPolicyAppendixRequest) returns (DiffPolicyAppendixResponse);
}
